[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "genomic-cohort-delivery-pipeline"
version = "2.0.0"
description = "Assemble, correct, and securely deliver large-scale genomic cohorts from multi-batch biobank data."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [{name = "Ugur Tuna"}]
keywords = ["genomics", "cohort", "plink", "bioinformatics", "delivery"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.16,<0.17", "mypy>=1.10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short -q"

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
# Explicit rule set so results do not drift when ruff changes its defaults.
select = ["E", "W", "F", "I", "UP", "B", "BLE", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]
